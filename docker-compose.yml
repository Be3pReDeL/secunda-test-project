x-app-environment: &app-environment
  PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-local-development-api-key-change-me}
  PAYMENTS_DATABASE_URL: ${PAYMENTS_DATABASE_URL:-postgresql+asyncpg://payments:payments@postgres:5432/payments}
  PAYMENTS_RABBITMQ_URL: ${PAYMENTS_RABBITMQ_URL:-amqp://payments:payments@rabbitmq:5672/}
  PAYMENTS_ALLOW_PRIVATE_WEBHOOKS: ${PAYMENTS_ALLOW_PRIVATE_WEBHOOKS:-false}

x-app-service: &app-service
  build:
    context: .
    target: runtime
  image: payment-processing-service:local
  environment: *app-environment

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_USER: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_PASS: payments
      RABBITMQ_DEFAULT_USER: payments
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command:
      - uvicorn
      - payment_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request("http://127.0.0.1:8000/health");
          request.add_header("X-API-Key", os.environ["PAYMENTS_API_KEY"]);
          urllib.request.urlopen(request, timeout=2).close()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  consumer:
    <<: *app-service
    command: ["faststream", "run", "payment_service.worker:app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          command = Path("/proc/1/cmdline").read_bytes();
          raise SystemExit(0 if b"faststream" in command else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:
  rabbitmq-data:
