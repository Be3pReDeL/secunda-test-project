[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-processing-service"
version = "0.1.0"
description = "Asynchronous payment processing service with transactional outbox delivery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "faststream[cli,rabbit]==0.7.4",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "mypy==1.19.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["payment_service"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "BLE", "C4", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["faststream.*"]
ignore_missing_imports = true
